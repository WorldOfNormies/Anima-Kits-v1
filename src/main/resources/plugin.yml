name: AnimaKits
version: '${version}'
main: com.worldofnormies.animakits.AnimaKitsPlugin
api-version: '1.21'
description: "A powerful, feature-rich kit management plugin with gradient support, multi-page GUIs, and Bedrock compatibility."
authors:
  - "World Of Normies"
website: "https://github.com/worldofnormies/AnimaKits"
softdepend:
  - floodgate
  - Geyser-Spigot
  - PlaceholderAPI

commands:
  anima:
    description: "Main AnimaKits command"
    usage: "/anima kits [subcommand]"
    aliases: [ ak, animakits ]

permissions:
  # --- Admin Master Node ---
  anima.kits.*:
    description: "Grants access to ALL AnimaKits commands and features."
    default: op
    children:
      anima.kits.add: true
      anima.kits.delete: true
      anima.kits.rename: true
      anima.kits.lore.add: true
      anima.kits.lore.edit: true
      anima.kits.lore.remove: true
      anima.kits.clonekit: true
      anima.kits.give: true
      anima.kits.giveall: true
      anima.kits.reload: true
      anima.kits.permission.add: true
      anima.kits.permission.remove: true
      anima.kits.permission.show: true
      anima.kits.permission.claim: true
      anima.kits.permission.claimfree: true
      anima.kits.setcooldown: true
      anima.kits.singleclaim: true

  # --- Default Player Access Nodes ---
  anima.kits.use:
    description: "Allows opening the visual kit claim browser menus."
    default: true

  anima.kits.claim:
    description: "Allows running the direct kit claim command syntax."
    default: true

  anima.kits.claim.*:
    description: "Allows claiming any existing kit by default."
    default: true

  anima.kits.list:
    description: "Allows viewing text list of available authorized kits."
    default: true

  anima.kits.help:
    description: "Allows viewing the basic player help instructions overview."
    default: true

  # --- Restricted Admin Action Nodes ---
  anima.kits.add:
    description: "Create a brand new kit framework."
    default: op

  anima.kits.delete:
    description: "Permanently delete an existing kit structure."
    default: op

  anima.kits.rename:
    description: "Modify an existing kit's profile display identity."
    default: op

  anima.kits.lore.add:
    description: "Append a fresh line of text lore to a kit."
    default: op

  anima.kits.lore.edit:
    description: "Modify a single line of index lore on a kit."
    default: op

  anima.kits.lore.remove:
    description: "Strip a line of index lore away from a kit."
    default: op

  anima.kits.clonekit:
    description: "Duplicate a kit directly to a new template."
    default: op

  anima.kits.give:
    description: "Force drop a specific kit onto a single player."
    default: op

  anima.kits.giveall:
    description: "Force distribute a kit to every active online connection."
    default: op

  anima.kits.reload:
    description: "Reload all internal config parameters dynamically."
    default: op

  anima.kits.permission.add:
    description: "Grant temporary or absolute generic nodes to profiles."
    default: op

  anima.kits.permission.remove:
    description: "Revoke nodes from profiles manually."
    default: op

  anima.kits.permission.show:
    description: "Inspect active kit nodes applied onto a player profile."
    default: op

  anima.kits.permission.claim:
    description: "Grant or revoke temporary or absolute specific kit claim access nodes."
    default: op

  anima.kits.permission.claimfree:
    description: "Grant or revoke temporary or absolute kit cooldown bypass nodes."
    default: op

  anima.kits.setcooldown:
    description: "Set an absolute cooldown window time limit on kits."
    default: op

  anima.kits.singleclaim:
    description: "Toggle one-time-only claim limitations on kits."
    default: op

  anima.kits.onjoinnew:
    description: "Set or clear the starter kit given to new players on first join."
    default: op

  # --- Item Edit Nodes ---
  anima.itemedit.*:
    description: "Master permission for all item editing features."
    default: op
    children:
      anima.itemedit.prefix: true
      anima.itemedit.suffix: true
      anima.itemedit.rename: true
      anima.itemedit.lore: true
      anima.itemedit.enchant: true
      anima.itemedit.unbreakable: true
      anima.itemedit.gloweffect: true
      anima.itemedit.repair: true

  anima.itemedit.use:
    description: "Basic access to item editing (prefix, suffix, rename, repair)."
    default: true
    children:
      anima.itemedit.prefix: true
      anima.itemedit.suffix: true
      anima.itemedit.rename: true
      anima.itemedit.repair: true

  anima.itemedit.prefix:
    description: "Allows setting item prefixes."
    default: op
  anima.itemedit.suffix:
    description: "Allows setting item suffixes."
    default: op
  anima.itemedit.rename:
    description: "Allows renaming items."
    default: op
  anima.itemedit.lore:
    description: "Allows editing item lore."
    default: op
  anima.itemedit.enchant:
    description: "Allows enchanting items."
    default: op
  anima.itemedit.unbreakable:
    description: "Allows setting items as unbreakable."
    default: op
  anima.itemedit.gloweffect:
    description: "Allows toggling item glow effect."
    default: op
  anima.itemedit.repair:
    description: "Allows repairing items."
    default: op

  # --- Rank Nodes ---
  anima.rank.*:
    description: "Master permission for all rank management features."
    default: op
