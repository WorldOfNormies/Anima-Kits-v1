name: AnimaKits
version: '${version}'
main: com.worldofnormies.animakits.AnimaKitsPlugin
api-version: '1.21'
description: "A powerful, feature-rich kit management plugin with gradient support, multi-page GUIs, and Bedrock compatibility."
authors:
  - "World Of Normies"
website: "https://github.com/worldofnormies/AnimaKits"
softdepend:
  - floodgate
  - Geyser-Spigot
  - PlaceholderAPI

commands:
  anima:
    description: "Main AnimaKits command"
    usage: "/anima kits [subcommand]"
    aliases: [ ak, animakits ]
    permission: anima.kits.use

permissions:
  anima.kits.*:
    description: "Grants access to ALL AnimaKits commands and features."
    default: op
    children:
      anima.kits.use: true
      anima.kits.display: true
      anima.kits.edit.add: true
      anima.kits.edit.remove: true
      anima.kits.edit.rename: true
      anima.kits.lore.edit: true
      anima.kits.lore.add: true
      anima.kits.lore.remove: true
      anima.kits.open: true
      anima.kits.clonekit: true
      anima.kits.give: true
      anima.kits.giveall: true
      anima.kits.reload: true
      anima.kits.help: true
      anima.kits.permission.add: true
      anima.kits.permission.remove: true
      anima.kits.permission.show: true

  anima.kits.use:
    description: "Open the main Kits GUI menu."
    default: op

  anima.kits.display:
    description: "Display (view-only) any kit's contents."
    default: op

  anima.kits.edit.add:
    description: "Add (create) a new kit."
    default: op

  anima.kits.edit.remove:
    description: "Remove/delete an existing kit."
    default: op

  anima.kits.edit.rename:
    description: "Rename an existing kit."
    default: op

  anima.kits.lore.edit:
    description: "Edit a specific lore line on a kit."
    default: op

  anima.kits.lore.add:
    description: "Add a new lore line to a kit."
    default: op

  anima.kits.lore.remove:
    description: "Remove a lore line from a kit."
    default: op

  anima.kits.open:
    description: "Directly open the edit GUI of a specific kit."
    default: op

  anima.kits.clonekit:
    description: "Clone an existing kit into a new one."
    default: op

  anima.kits.give:
    description: "Give a kit to a specific player."
    default: op

  anima.kits.giveall:
    description: "Give a kit to all online players."
    default: op

  anima.kits.reload:
    description: "Reload the AnimaKits plugin configuration."
    default: op

  anima.kits.help:
    description: "View the AnimaKits help menu."
    default: op

  anima.kits.permission.add:
    description: "Grant a timed or permanent AnimaKits permission to a player."
    default: op

  anima.kits.permission.remove:
    description: "Revoke an AnimaKits permission from a player."
    default: op

  anima.kits.permission.show:
    description: "Show all AnimaKits permissions assigned to a player."
    default: op
