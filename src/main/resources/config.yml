# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#                     AnimaKits Configuration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general:
  date-format: "dd/MM/yyyy HH:mm"
  prefix: "<gradient:#54DAF4:#545EB6><bold>[AnimaKits]</bold></gradient> "

# Kit to automatically give to brand-new players on their very first join.
# Set via:   /anima kits onjoinnew <kit name>
# Clear via: /anima kits onjoinnew clear
# Leave blank to disable.
join-kit: ""

messages:

  # ─────────────────────────────────────────────────────────────
  #  SYSTEM
  # ─────────────────────────────────────────────────────────────

  no-permission: >-
    <newline>
    <gradient:#FF4B4B:#FF8585><bold>  ✕  Access Denied</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>You do not have permission to run this command.</gray>
    <newline>

  player-not-found: >-
    <newline>
    <gradient:#FF4B4B:#FF8585><bold>  ✕  Player Not Found</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>No online player matches</gray> <white><bold>'{player}'</bold></white><gray>.</gray>
    <newline>
    <dark_gray>  ┃</dark_gray> <dark_gray>Make sure the player is online and the name is spelled correctly.</dark_gray>
    <newline>

  usage-error: >-
    <newline>
    <gradient:#FF4B4B:#FF8585><bold>  ✕  Wrong Usage</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Correct format:</gray>
    <newline>
    <dark_gray>  ┃  </dark_gray><gradient:#54DAF4:#545EB6>{usage}</gradient>
    <newline>

  reload: >-
    <newline>
    <gradient:#54DAF4:#545EB6><bold>  ✓  Reload Complete</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Plugin configuration has been successfully reloaded.</gray>
    <newline>

  # ─────────────────────────────────────────────────────────────
  #  KIT MANAGEMENT
  # ─────────────────────────────────────────────────────────────

  name-empty: >-
    <newline>
    <gradient:#FF4B4B:#FF8585><bold>  ✕  Missing Name</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>The kit name cannot be left blank.</gray>
    <newline>
    <dark_gray>  ┃  </dark_gray><gradient:#54DAF4:#545EB6>/anima kits add <name></gradient>
    <newline>

  name-too-long: >-
    <newline>
    <gradient:#FF4B4B:#FF8585><bold>  ✕  Name Too Long</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Maximum kit name length is</gray> <white><bold>64 characters</bold></white><gray>.</gray>
    <newline>

  kit-already-exists: >-
    <newline>
    <gradient:#FF4B4B:#FF8585><bold>  ✕  Already Exists</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>A kit named</gray> <white><bold>'{kit}'</bold></white> <gray>already exists.</gray>
    <newline>
    <dark_gray>  ┃</dark_gray> <dark_gray>Use a different name, or delete the existing kit first.</dark_gray>
    <newline>

  kit-not-found: >-
    <newline>
    <gradient:#FF4B4B:#FF8585><bold>  ✕  Kit Not Found</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>No kit matches</gray> <white><bold>'{kit}'</bold></white><gray>.</gray>
    <newline>
    <dark_gray>  ┃</dark_gray> <dark_gray>Use</dark_gray> <white>/anima kits list</white> <dark_gray>to see all available kits.</dark_gray>
    <newline>

  kit-created: >-
    <newline>
    <gradient:#54DAF4:#545EB6><bold>  ✓  Kit Created</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>New kit</gray> <white><bold>{kit}</bold></white> <gray>has been created.</gray>
    <newline>
    <dark_gray>  ┃</dark_gray> <dark_gray>Open the editor with</dark_gray> <white>/anima kits</white> <dark_gray>to add items.</dark_gray>
    <newline>

  kit-deleted: >-
    <newline>
    <gradient:#FF4B4B:#FF8585><bold>  ✕  Kit Deleted</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Kit</gray> <white><bold>{kit}</bold></white> <gray>has been permanently removed.</gray>
    <newline>

  kit-renamed: >-
    <newline>
    <gradient:#54DAF4:#545EB6><bold>  ✓  Kit Renamed</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <red><bold>{old}</bold></red> <gray>→</gray> <green><bold>{new}</bold></green>
    <newline>

  # ─────────────────────────────────────────────────────────────
  #  KIT DISTRIBUTION
  # ─────────────────────────────────────────────────────────────

  kit-received: >-
    <newline>
    <gradient:#54DAF4:#545EB6><bold>  ✦  Kit Received</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Kit:</gray> <white><bold>{kit}</bold></white>  <dark_gray>·</dark_gray>  <gray>Amount:</gray> <white><bold>x{amount}</bold></white>
    <newline>

  join-kit-received: >-
    <newline>
    <gradient:#54DAF4:#545EB6><bold>  ✦  Welcome!</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>You received the starter kit</gray> <white><bold>{kit}</bold></white><gray>. Enjoy your adventure!</gray>
    <newline>

  kit-given: >-
    <newline>
    <gradient:#54DAF4:#545EB6><bold>  ✦  Kit Dispatched</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Kit:</gray>    <yellow><bold>{kit}</bold></yellow>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Player:</gray> <white><bold>{player}</bold></white>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Amount:</gray> <white><bold>x{amount}</bold></white>
    <newline>

  kit-given-all: >-
    <newline>
    <gradient:#54DAF4:#545EB6><bold>  ✦  Global Dispatch</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Kit:</gray>     <yellow><bold>{kit}</bold></yellow>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Amount:</gray>  <white><bold>x{amount}</bold></white>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Players:</gray> <white><bold>{count} online</bold></white>
    <newline>

  # ─────────────────────────────────────────────────────────────
  #  LORE
  # ─────────────────────────────────────────────────────────────

  lore-added: >-
    <newline>
    <gradient:#54DAF4:#545EB6><bold>  ✓  Lore Added</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>New lore line appended to kit</gray> <white><bold>{kit}</bold></white><gray>.</gray>
    <newline>

  lore-edited: >-
    <newline>
    <gradient:#54DAF4:#545EB6><bold>  ✓  Lore Updated</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Kit:</gray>  <white><bold>{kit}</bold></white>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Line:</gray> <yellow><bold>#{line}</bold></yellow>
    <newline>

  lore-removed: >-
    <newline>
    <gradient:#FF4B4B:#FF8585><bold>  ✕  Lore Removed</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Kit:</gray>  <white><bold>{kit}</bold></white>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Line:</gray> <yellow><bold>#{line}</bold></yellow> <gray>has been deleted.</gray>
    <newline>

  lore-invalid-line: >-
    <newline>
    <gradient:#FF4B4B:#FF8585><bold>  ✕  Invalid Line Number</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Valid range:</gray> <white><bold>1 – {max}</bold></white>
    <newline>
    <dark_gray>  ┃  </dark_gray><gradient:#54DAF4:#545EB6>/anima kits lore remove <kit> <line#></gradient>
    <newline>

  kit-cloned: >-
    <newline>
    <gradient:#54DAF4:#545EB6><bold>  ✓  Kit Cloned</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Source:</gray> <white><bold>{old}</bold></white>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Clone: </gray> <yellow><bold>{new}</bold></yellow>
    <newline>

  # ─────────────────────────────────────────────────────────────
  #  PERMISSIONS
  # ─────────────────────────────────────────────────────────────

  perm-invalid: >-
    <newline>
    <gradient:#FF4B4B:#FF8585><bold>  ✕  Invalid Permission</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <white><bold>'{perm}'</bold></white> <gray>is not a recognized AnimaKits permission node.</gray>
    <newline>
    <dark_gray>  ┃</dark_gray> <dark_gray>Run</dark_gray> <white>/anima kits help</white> <dark_gray>to see valid permission nodes.</dark_gray>
    <newline>

  perm-granted: >-
    <newline>
    <gradient:#54DAF4:#545EB6><bold>  ✓  Permission Granted</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Node:     </gray> <yellow><bold>{perm}</bold></yellow>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Player:   </gray> <white><bold>{player}</bold></white>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Duration: </gray> <white><bold>{duration}</bold></white>
    <newline>

  perm-revoked: >-
    <newline>
    <gradient:#FF4B4B:#FF8585><bold>  ✕  Permission Revoked</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Node:   </gray> <yellow><bold>{perm}</bold></yellow>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Player: </gray> <white><bold>{player}</bold></white>
    <newline>

  perm-show-header: >-
    <newline>
    <gradient:#54DAF4:#545EB6><bold>  ━━  Permission Profile: {player}  ━━</bold></gradient>
    <newline>

  perm-show-empty: >-
    <dark_gray>  ┃</dark_gray> <gray>No custom AnimaKits permissions assigned to this player.</gray>
    <newline>

  perm-show-entry: >-
    <dark_gray>  ┃  </dark_gray><gradient:#54DAF4:#545EB6>➔</gradient> <yellow>{perm}</yellow> <dark_gray>·</dark_gray> <gray>Expires: <white>{expires}</white></gray>

  # ─────────────────────────────────────────────────────────────
  #  COOLDOWN / SETCOOLDOWN
  # ─────────────────────────────────────────────────────────────

  cooldown-set: >-
    <newline>
    <gradient:#54DAF4:#545EB6><bold>  ✓  Cooldown Set</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Kit:      </gray> <white><bold>{kit}</bold></white>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Cooldown: </gray> <white><bold>{time}</bold></white>
    <newline>

  cooldown-invalid: >-
    <newline>
    <gradient:#FF4B4B:#FF8585><bold>  ✕  Invalid Duration</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Could not parse</gray> <white><bold>'{input}'</bold></white> <gray>as a valid time value.</gray>
    <newline>
    <dark_gray>  ┃</dark_gray> <dark_gray>Accepted formats:</dark_gray> <white>30s  5m  2h  1d  1d2h30m  3600</white>
    <newline>
    <dark_gray>  ┃  </dark_gray><gradient:#54DAF4:#545EB6>/anima kits setcooldown <kit> <time></gradient>
    <newline>

  # ─────────────────────────────────────────────────────────────
  #  SINGLE CLAIM
  # ─────────────────────────────────────────────────────────────

  singleclaim-set: >-
    <newline>
    <gradient:#54DAF4:#545EB6><bold>  ✓  Single-Claim Updated</bold></gradient>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Kit:    </gray> <white><bold>{kit}</bold></white>
    <newline>
    <dark_gray>  ┃</dark_gray> <gray>Status: </gray> <white><bold>{value}</bold></white>
    <newline>

  # ─────────────────────────────────────────────────────────────
  #  CHAT INPUT PROMPTS  (shown when the GUI closes for chat input)
  # ─────────────────────────────────────────────────────────────

  name-prompt: |
    <gradient:#54DAF4:#545EB6><bold>━━━━ AnimaKits · Rename Kit ━━━━</bold></gradient>
    <gradient:#54DAF4:#545EB6><bold>⚠ ATTENTION:</bold></gradient> <gray>To apply formatting, include backslashes (\\) exactly as shown:</gray>

    <dark_gray>▪ </dark_gray><yellow>\\<gradient:#hex1:#hex2\\></yellow><gray> ➔ </gray>\\<gradient:#FF5500:#FFCC00\\>Vip Kit
    <dark_gray>▪ </dark_gray><yellow>\\<rainbow\\></yellow><gray> ➔ </gray>\\<rainbow\\>Arcade Kit
    <dark_gray>▪ </dark_gray><yellow>\\<bold\\></yellow><gray> ➔ </gray>\\<bold\\>Heavy Kit
    <dark_gray>▪ </dark_gray><yellow>\\<italic\\></yellow><gray> ➔ </gray>\\<italic\\>Swift Kit
    <dark_gray>▪ </dark_gray><yellow>\\<underline\\></yellow><gray> ➔ </gray>\\<underline\\>God Kit
    <dark_gray>▪ </dark_gray><yellow>\\<colorname\\></yellow><gray> ➔ </gray>\\<red\\>Ruby Kit
    <dark_gray>▪ </dark_gray><yellow>\\<#hexcolorcode\\></yellow><gray> ➔ </gray>\\<#A8FF33\\>Lime Kit

    <yellow>✎ Type the new kit name in chat and press <white>Enter</white>.</yellow>
    <dark_gray>Type <white>//cancel</white> or press <white>Escape</white> to abort.</dark_gray>
    <gradient:#54DAF4:#545EB6><bold>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</bold></gradient>

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#                     ItemEdit Configuration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

itemedit:
  # Cooldown in seconds for /anima itemedit repair (for players with anima.itemedit.repair.cooldown).
  # Set to 0 to disable cooldown entirely.
  # Admins with anima.itemedit.* or anima.itemedit.admin bypass this automatically.
  # Examples: 300 = 5 minutes, 3600 = 1 hour, 86400 = 1 day
  repair-cooldown: 300
