# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#                     AnimaKits Configuration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general:
  date-format: "dd/MM/yyyy HH:mm"
  prefix: "<gradient:#54DAF4:#545EB6><bold>[AnimaKits]</bold></gradient> "

# Kit to automatically give to brand-new players on their very first join.
# Set via: /anima kits onjoinnew <kit name>
# Clear via: /anima kits onjoinnew clear
# Leave blank to disable.
join-kit: ""

messages:
  # --- System Core Responses ---
  no-permission: "<gradient:#FF4B4B:#FF8585><bold>✕ Error:</bold> You do not have permission to execute this operation.</gradient>"
  player-not-found: "<gradient:#FF4B4B:#FF8585><bold>✕ Error:</bold> No online player found matching</gradient> <bold><white>'<player>'</white></bold><gradient:#FF4B4B:#FF8585>.</gradient>"
  usage-error: "<gradient:#FF4B4B:#FF8585><bold>✕ Syntax:</bold> Incorrect usage template.</gradient> <gray>Correct format:</gray> <gradient:#54DAF4:#545EB6><usage></gradient>"
  reload: "<gradient:#54DAF4:#545EB6><bold>✓ System:</bold> Plugin configuration settings have been successfully reloaded!</gradient>"

  # --- Kit Creator Management ---
  name-empty: "<gradient:#FF4B4B:#FF8585><bold>✕ Error:</bold> The kit name field cannot be left blank.</gradient>"
  name-too-long: "<gradient:#FF4B4B:#FF8585><bold>✕ Error:</bold> Maximum name length exceeded (Limit: 64 characters).</gradient>"
  kit-already-exists: "<gradient:#FF4B4B:#FF8585><bold>✕ Error:</bold> A kit configuration named</gradient> <bold><white>'<kit>'</white></bold> <gradient:#FF4B4B:#FF8585>already exists.</gradient>"
  kit-not-found: "<gradient:#FF4B4B:#FF8585><bold>✕ Error:</bold> Could not find any kit configuration matching</gradient> <bold><white>'<kit>'</white></bold><gradient:#FF4B4B:#FF8585>.</gradient>"
  kit-created: "<gradient:#54DAF4:#545EB6><bold>✓ Success:</bold> New kit framework</gradient> <bold><white><kit></white></bold> <gradient:#54DAF4:#545EB6>has been created.</gradient>"
  kit-deleted: "<gradient:#FF4B4B:#FF8585><bold>✕ Deleted:</bold> The kit configuration</gradient> <bold><white><kit></white></bold> <gradient:#FF4B4B:#FF8585>has been permanently erased.</gradient>"
  kit-renamed: "<gradient:#54DAF4:#545EB6><bold>✓ Success:</bold> Kit has been renamed from</gradient> <bold><red><old></red></bold> <gradient:#54DAF4:#545EB6>➔</gradient> <bold><green><new></green></bold><gradient:#54DAF4:#545EB6>.</gradient>"

  # --- Kit Distribution Actions ---
  kit-received: "<gradient:#54DAF4:#545EB6><bold>✦ Claim:</bold> You have received kit</gradient> <bold><white><kit></white></bold> <gray>•</gray> <gradient:#54DAF4:#545EB6><bold>x<amount></bold></gradient>"
  join-kit-received: "<gradient:#54DAF4:#545EB6><bold>✦ Welcome!</bold> You have been given the starter kit</gradient> <bold><white><kit></white></bold><gradient:#54DAF4:#545EB6>. Enjoy your adventure!</gradient>"
  kit-given: "<gradient:#54DAF4:#545EB6><bold>✦ Dispatch:</bold> Successfully transferred</gradient> <bold><white>x<amount></white></bold> <gradient:#54DAF4:#545EB6>of kit</gradient> <bold><yellow><kit></yellow></bold> <gradient:#54DAF4:#545EB6>to player</gradient> <bold><white><player></white></bold><gradient:#54DAF4:#545EB6>.</gradient>"
  kit-given-all: "<gradient:#54DAF4:#545EB6><bold>✦ Global:</bold> Dispatched</gradient> <bold><white>x<amount></white></bold> <gradient:#54DAF4:#545EB6>of kit</gradient> <bold><yellow><kit></yellow></bold> <gradient:#54DAF4:#545EB6>to all</gradient> <bold><white><count></white></bold> <gradient:#54DAF4:#545EB6>online players.</gradient>"

  # --- Lore Modification Responses ---
  lore-added: "<gradient:#54DAF4:#545EB6><bold>✓ Lore:</bold> Added a new line of lore text successfully to kit</gradient> <bold><white><kit></white></bold><gradient:#54DAF4:#545EB6>.</gradient>"
  lore-edited: "<gradient:#54DAF4:#545EB6><bold>✓ Lore:</bold> Successfully updated lore line index</gradient> <bold><yellow>#<line></yellow></bold> <gradient:#54DAF4:#545EB6>on kit</gradient> <bold><white><kit></white></bold><gradient:#54DAF4:#545EB6>.</gradient>"
  lore-removed: "<gradient:#FF4B4B:#FF8585><bold>✕ Lore:</bold> Removed lore line index</gradient> <bold><yellow>#<line></yellow></bold> <gradient:#FF4B4B:#FF8585>from kit</gradient> <bold><white><kit></white></bold><gradient:#FF4B4B:#FF8585>.</gradient>"
  lore-invalid-line: "<gradient:#FF4B4B:#FF8585><bold>✕ Error:</bold> Invalid line number provided. (Valid structural range: 1 to</gradient> <bold><white><max></white></bold><gradient:#FF4B4B:#FF8585>).</gradient>"
  kit-cloned: "<gradient:#54DAF4:#545EB6><bold>✓ Template:</bold> Successfully duplicated kit template</gradient> <bold><white><old></white></bold> <gradient:#54DAF4:#545EB6>onto new clone</gradient> <bold><yellow><new></yellow></bold><gradient:#54DAF4:#545EB6>.</gradient>"

  # --- Stored Database Permission Responses ---
  perm-invalid: "<gradient:#FF4B4B:#FF8585><bold>✕ Error:</bold></gradient> <bold><white>'<perm>'</white></bold> <gradient:#FF4B4B:#FF8585>is not a recognized or valid plugin permission node.</gradient>"
  perm-granted: "<gradient:#54DAF4:#545EB6><bold>✓ Granted</bold></gradient> <gray>|</gray> <yellow><perm></yellow> <gray>→</gray> <white><player></white><gray><duration></gray>"
  perm-revoked: "<gradient:#FF4B4B:#FF8585><bold>✕ Revoked</bold></gradient> <gray>|</gray> <yellow><perm></yellow> <gray>→</gray> <white><player></white>"
  perm-show-header: "<gradient:#54DAF4:#545EB6><bold>━━━━━━━ Active Kit Profile: <player> ━━━━━━━</bold></gradient>"
  perm-show-empty: "<gray>   ▪ There are no active custom kit permissions assigned to this profile.</gray>"
  perm-show-entry: "  <gradient:#54DAF4:#545EB6>➔</gradient> <yellow><perm></yellow> <dark_gray>·</dark_gray> <gray>Expires: <white><expires></white></gray>"

  # ── Chat Name Prompts ──────
  name-prompt: |
    <gradient:#54DAF4:#545EB6><bold>━━━━ AnimaKits · Rename Kit ━━━━</bold></gradient>
    <gradient:#54DAF4:#545EB6><bold>⚠ ATTENTION:</bold></gradient> <gray>To apply formatting, you must include the backslashes (<white>\\</white>) exactly as shown:</gray>
    
    <dark_gray>▪ </dark_gray><yellow>\<gradient:#hex1:#hex2\></yellow><gray> ➔ </gray>\<gradient:#FF5500:#FFCC00\>Vip Kit
    <dark_gray>▪ </dark_gray><yellow>\<rainbow\></yellow><gray> ➔ </gray>\<rainbow\>Arcade Kit
    <dark_gray>▪ </dark_gray><yellow>\<bold\></yellow><gray> ➔ </gray>\<bold\>Heavy Kit
    <dark_gray>▪ </dark_gray><yellow>\<italic\></yellow><gray> ➔ </gray>\<italic\>Swift Kit
    <dark_gray>▪ </dark_gray><yellow>\<underline\></yellow><gray> ➔ </gray>\<underline\>God Kit
    <dark_gray>▪ </dark_gray><yellow>\<colorname\></yellow><gray> ➔ </gray>\<red\>Ruby Kit
    <dark_gray>▪ </dark_gray><yellow>\<#hexcolorcode\></yellow><gray> ➔ </gray>\<#A8FF33\>Lime Kit
    
    <yellow>✎ Type the new kit name in chat and press <white>Enter</white>.</yellow>
    <dark_gray>Type <white>//cancel</white> or press <white>Escape</white> to abort.</dark_gray>
    <gradient:#54DAF4:#545EB6><bold>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</bold></gradient>
