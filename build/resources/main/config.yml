# ╔══════════════════════════════════════════════════════╗
# ║           AnimaKits Configuration File              ║
# ║  Supports MiniMessage tags, &codes, and &#RRGGBB   ║
# ╚══════════════════════════════════════════════════════╝

general:
  prefix: "<gradient:#54DAF4:#545EB6><bold>AnimaKits</bold></gradient> <dark_gray>»</dark_gray>"
  # Date/time format for timed permissions display
  date-format: "dd/MM/yyyy HH:mm"

gui:
  # Title shown in the main kits browser
  main-title: "<gradient:#54DAF4:#545EB6><bold>✦ Kit Browser ✦</bold></gradient>"
  # Title shown inside a kit's editor / viewer
  kit-editor-title: "<gradient:#54DAF4:#545EB6><bold>Editing: {kit}</bold></gradient>"
  kit-display-title: "<gradient:#54DAF4:#545EB6><bold>Viewing: {kit}</bold></gradient>"
  # How many kits to show per page in the browser
  kits-per-page: 45
  # Items per page inside a kit editor
  items-per-page: 45
  # Border material (any valid Material name)
  border-material: BLACK_STAINED_GLASS_PANE
  border-name: " "
  # Navigation button materials
  prev-page-material: ARROW
  next-page-material: ARROW
  prev-page-name: "<gray>« Previous Page</gray>"
  next-page-name: "<gray>Next Page »</gray>"

messages:
  # ── Kit Management ──────────────────────────────────────────────
  kit-created: "<green>✔ Kit <white>{kit}</white> created successfully!</green>"
  kit-deleted: "<red>✘ Kit <white>{kit}</white> has been deleted.</red>"
  kit-renamed: "<green>✔ Kit <white>{old}</white> renamed to <white>{new}</white>.</green>"
  kit-cloned: "<green>✔ Kit <white>{old}</white> cloned into <white>{new}</white>.</green>"
  kit-not-found: "<red>✘ No kit named <white>{kit}</white> was found.</red>"
  kit-already-exists: "<red>✘ A kit named <white>{kit}</white> already exists.</red>"

  # ── Lore ────────────────────────────────────────────────────────
  lore-added: "<green>✔ Lore line added to <white>{kit}</white>.</green>"
  lore-edited: "<green>✔ Lore line <white>{line}</white> of <white>{kit}</white> updated.</green>"
  lore-removed: "<red>✘ Lore line <white>{line}</white> removed from <white>{kit}</white>.</red>"
  lore-invalid-line: "<red>✘ Invalid line number. Use a number between 1 and {max}.</red>"

  # ── Give ────────────────────────────────────────────────────────
  kit-given: "<green>✔ Gave kit <white>{kit}</white> ×{amount} to <white>{player}</white>.</green>"
  kit-given-all: "<green>✔ Gave kit <white>{kit}</white> ×{amount} to all <white>{count}</white> online player(s).</green>"
  kit-received: "<green>✔ You received kit <white>{kit}</white> ×{amount}.</green>"
  player-not-found: "<red>✘ Player <white>{player}</white> is not online.</red>"

  # ── Permissions ─────────────────────────────────────────────────
  perm-granted: "<green>✔ Granted <white>{perm}</white> to <white>{player}</white>{duration}.</green>"
  perm-revoked: "<red>✘ Revoked <white>{perm}</white> from <white>{player}</white>.</red>"
  perm-show-header: "<gradient:#54DAF4:#545EB6>Permissions for {player}:</gradient>"
  perm-show-entry: "  <gray>• <white>{perm}</white> – expires: <aqua>{expires}</aqua></gray>"
  perm-show-empty: "  <gray>No AnimaKits permissions assigned.</gray>"
  perm-invalid: "<red>✘ <white>{perm}</white> is not a valid AnimaKits permission.</red>"

  # ── General ─────────────────────────────────────────────────────
  reload: "<green>✔ AnimaKits config reloaded.</green>"
  no-permission: "<red>✘ You do not have permission to do that.</red>"
  usage-error: "<red>✘ Usage: <white>{usage}</white></red>"

  # ── Name Input (chat prompt shown while awaiting kit name) ──────
  name-prompt: |
    <gradient:#54DAF4:#545EB6><bold>✦ AnimaKits — Set Kit Name ✦</bold></gradient>
    <gray>Type the new name in chat, then press <white>Enter</white>.</gray>
    <gray>Type <red>cancel</red> to abort.</gray>

    <yellow>Colour Codes & Gradients:</yellow>
    <gray>  Legacy codes:   <white>&a Green  &c Red  &b Aqua  &6 Gold  &l Bold  &o Italic</white></gray>
    <gray>  Hex colour:     <white>&#FF5500 (Birdflop-style)</white></gray>
    <gray>  MiniMessage:    <white><red>…</red>  <bold>…</bold>  <italic>…</italic></white></gray>
    <gray>  Gradient:       <white><gradient:#54DAF4:#545EB6>My Kit Name</gradient></white></gray>

    <yellow>Examples:</yellow>
    <gray>  <white>&6&lGolden Kit</white>   → <gold><bold>Golden Kit</bold></gold></gray>
    <gray>  <white><gradient:#54DAF4:#545EB6>Rainbow Kit</gradient></white>   → gradient blue-to-purple text</gray>
    <gray>  <white>&#FF5500Lava Kit</white>   → <color:#FF5500>Lava Kit</color></gray>

  name-cancelled: "<gray>Kit name entry cancelled.</gray>"
  name-too-long: "<red>✘ Name is too long (max 64 characters).</red>"
  name-empty: "<red>✘ Name cannot be empty.</red>"
